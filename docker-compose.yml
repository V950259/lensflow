version: '3.8'

services:
  backend:
    build: ./backend
    container_name: lensflow-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - API_KEY=${API_KEY}
      - API_BASE_URL=${API_BASE_URL}
      - MODEL_NAME=${MODEL_NAME}
    restart: always

  frontend:
    build: ./frontend
    container_name: lensflow-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/api/v1
    depends_on:
      - backend
    restart: always
